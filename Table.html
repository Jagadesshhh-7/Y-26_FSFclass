<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title> Tables </title>
    </head>
    <body>
        <h2> HTML TABLE TAG EXAMPLE </h2>
        <table border="2">
            <caption> Student Marks </caption>

            <colgroup>
            <col style="background-color: rgb(255, 249, 127);">
            <col style="background-color: rgb(255, 249, 127);">
            <col style="background-color: rgb(255, 249, 127);">
        </colgroup>
            <thread>

            <tr>
                <th>Student Name</th>
                <th>Subject</th>
                <th>Marks</th>
            </tr>
            </thread>
            <tr>
                
                <td rowspan="2"> jagadesh</td>
                <td>HTML</td>
                <td>80</td>
            </tr>
            <tr>
                <!-- And removed from here -->
                <td>CSS</td>
                <td>90</td>
            </tr>
            <tr>
                <td rowspan="2">jagadesh</td>
                <td>java</td>
                <td>98</td>
            </tr>
            <tr>
                
                <td>eng</td>
                <td>99</td>
            </tr>
            </tbody>
            <tfoot>
            <tr>
                <td> Total Students</td>
                <td> Total Students</td>
                <td>2</td>
            </tr>
            </tfoot>

        </table>
    </body>
</html>
