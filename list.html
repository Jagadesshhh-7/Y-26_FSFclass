<html>
	<head>
		<title> HTML LISTS </title>
	</head>
	<body>
<!--Ordered list-->
###Ordered list###
		<ol type="1" start="5">
			<li>HTML</li> 
			<li>CSS</li>
			<li>JS</li>
		</ol>
<!--UnOrdered list-->
###UnOrdered list###
		<ul Style="list-style-type:circle;">
			<li>HTML</li> 
			<li>CSS</li>
			<li>JS</li>
		</ul>
<!--Description list-->
###Description list###
	<dl>
		<dl>HTML</dl> 
		<dd>Hyper Text Markup Language</dd>
		<dl>CSS</dl>
		<dd>Cascading Style Sheet</dd> 
	</dl>
<!--Nested list-->
###Nested list###
	<ul>
		<li>Frontend</li>
			<ol> <li>HTML<li>
			     <li>CSS</li>
			     <li>JS</li>
			</ol>
		<li>Backend</li>
			<ol> <li>Java</li> </ol>
	</ul>
	</body>
</html>
